name: Deploy Friend Orbit

on:
  push:
    branches: [rebuild-v3]
    paths:
      - 'friend-orbit/**'
      - '.github/workflows/friend-orbit-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: friend-orbit
      - id: deployment
        uses: actions/deploy-pages@v4
